<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Structured Link Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #eef2f6;
    display: flex;
    justify-content: center;
    padding: 30px;
  }

  .container {
    width: 100%;
    max-width: 850px;
    display: grid;
    gap: 14px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 700;
  }

  .big-box {
    background: #d6dbe3;
    border: 3px solid #111;
    border-radius: 14px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    background: white;
    border: 2px solid #111;
    border-radius: 12px;
    display: grid;
    grid-template-rows: auto auto;
    padding: 14px;
    gap: 10px;
    cursor: grab;
  }

  .card:active { cursor: grabbing; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title {
    font-size: 16px;
    font-weight: 700;
  }

  .desc {
    font-size: 12px;
    color: #555;
    margin-top: 3px;
  }

  .visit {
    border: 2px solid #111;
    padding: 6px 10px;
    border-radius: 8px;
    text-decoration: none;
    color: #111;
    font-weight: 600;
    font-size: 12px;
    background: #f8fafc;
  }

  .github-box {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 2px solid #111;
    border-radius: 999px;
    padding: 3px 8px;
    text-decoration: none;
    background: #111;
    color: #fff;
    font-weight: 600;
    font-size: 11px;
    width: fit-content;
  }

  .github-icon {
    width: 12px;
    height: 12px;
    fill: #fff;
  }

  .drag-over { outline: 3px dashed #111; }

  .contact-box {
    background: #d6dbe3;
    border: 3px solid #111;
    border-radius: 14px;
    padding: 16px;
  }

  .contact-inner {
    background: white;
    border: 2px solid #111;
    border-radius: 12px;
    padding: 14px;
  }

  .contact-link {
    color: #111;
    font-weight: 600;
    text-decoration: none;
  }

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>⚡ Link Dashboard</h1>
  </div>

  <div class="big-box" id="bigBox">

    <div class="card" draggable="true">
      <div class="top">
        <div>
          <div class="title">BD Tax Management</div>
          <div class="desc">Tax & Budget System</div>
        </div>
        <a class="visit" href="https://firered-v7s.github.io/BD-Tax-Management-and-Budget-Management-v1/" target="_blank">Visit</a>
      </div>
      <a class="github-box" href="https://github.com/FireRed-v7s/BD-Tax-Management-and-Budget-Management-v1" target="_blank">
        <svg class="github-icon" viewBox="0 0 24 24"><path d="M12 .5C5.7.5.7 5.7.7 12.2c0 5.2 3.4 9.6 8.2 11.1.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 1.6.8 2.1 1.2.1-.8.4-1.2.7-1.5-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.4 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.4-1.5 3.4-1.2 3.4-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.8-5.5 6.1z"/></svg>
        GitHub
      </a>
    </div>

    <div class="card" draggable="true">
      <div class="top">
        <div>
          <div class="title">Flow Space</div>
          <div class="desc">Productivity Web App</div>
        </div>
        <a class="visit" href="https://firered-v7s.github.io/Flow-Space-v1/" target="_blank">Visit</a>
      </div>
      <a class="github-box" href="https://github.com/FireRed-v7s/Flow-Space-v1" target="_blank">
        <svg class="github-icon" viewBox="0 0 24 24"><path d="M12 .5C5.7.5.7 5.7.7 12.2c0 5.2 3.4 9.6 8.2 11.1.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 1.6.8 2.1 1.2.1-.8.4-1.2.7-1.5-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.4 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.4-1.5 3.4-1.2 3.4-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.8-5.5 6.1z"/></svg>
        GitHub
      </a>
    </div>

  </div>

  <div class="contact-box">
    <div class= <"title"> Contact Me </div>
    <div class="contact-inner">
      <div class="title">Email: nafijsikder5@gmail.com</div>
      <div class="title">Phone: 01970236940</div>
    </div>
  </div>

</div>

<script>
let dragged = null;

function addDragEvents(card) {
  card.addEventListener("dragstart", () => dragged = card);

  card.addEventListener("dragover", (e) => {
    e.preventDefault();
    card.classList.add("drag-over");
  });

  card.addEventListener("dragleave", () => card.classList.remove("drag-over"));

  card.addEventListener("drop", () => {
    card.classList.remove("drag-over");
    if (dragged && dragged !== card) {
      document.getElementById("bigBox").insertBefore(dragged, card);
    }
  });
}

function init() {
  document.querySelectorAll(".card").forEach(addDragEvents);
}

init();
</script>

</body>
</html>
